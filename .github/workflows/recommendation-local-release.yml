name: Release recommendation service to local Kubernetes

on:
  push:
    branches:
      - local
    paths:
      - apps/recommendation/**
      - .github/workflows/recommendation-local-release.yml
      - scripts/promote.py
  workflow_dispatch:

concurrency:
  group: recommendation-local-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: otel-demo-local-recommendation
  LOCAL_GITOPS_REPOSITORY: lackito/otel-demo-gitops-local
  REGISTRY: ghcr.io
  VALUES_FILE: applications/otel-demo/values.yaml

jobs:
  release:
    name: Build, publish, and update local desired state (${{ github.sha }})
    if: github.ref == 'refs/heads/local'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out application source
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test and promotion dependencies
        run: |
          python -m pip install --only-binary=:all: ruamel.yaml==0.18.16 grpcio==1.78.0 grpcio-tools==1.78.0

      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          source_revision="$(git rev-parse HEAD)"
          image_repository="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          {
            echo "repository=${image_repository}"
            echo "tag=${source_revision}"
            echo "uri=${image_repository}:${source_revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify local GitOps write access
        env:
          GH_TOKEN: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
        shell: bash
        run: |
          if [[ "$(gh api "repos/${LOCAL_GITOPS_REPOSITORY}" --jq '.permissions.push')" != "true" ]]; then
            echo "LOCAL_GITOPS_REPOSITORY_TOKEN cannot write to ${LOCAL_GITOPS_REPOSITORY}." >&2
            echo "Grant the fine-grained token access to this repository with Contents: Read and write." >&2
            exit 1
          fi

      - name: Check out local GitOps configuration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LOCAL_GITOPS_REPOSITORY }}
          ref: main
          token: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
          path: local-gitops
          persist-credentials: true

      - name: Test local promotion
        run: python -m unittest discover -s tests -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native arm64 image
        uses: docker/build-push-action@v7
        with:
          context: apps/recommendation
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.uri }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=recommendation-local
          cache-to: type=gha,mode=max,scope=recommendation-local

      - name: Test requests and telemetry before publishing
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: python apps/recommendation/smoke.py "$IMAGE_URI"

      - name: Publish tested image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: docker push "$IMAGE_URI"

      - name: Verify anonymous image access
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          image_path="${IMAGE_REPOSITORY#ghcr.io/}"
          token="$(
            curl \
              --fail \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --silent \
              --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_path}:pull" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${token}" \
            --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${image_path}/manifests/${IMAGE_TAG}" \
            >/dev/null || {
              echo "The image was published but is not anonymously pullable." >&2
              echo "Make the GHCR package public, then rerun this workflow." >&2
              exit 1
            }

      - name: Promote verified image with concurrent-update retries
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          python scripts/promote.py --checkout local-gitops --file "$VALUES_FILE" \
            --component recommendation --target local \
            --repository "$IMAGE_REPOSITORY" --tag "$IMAGE_TAG"
