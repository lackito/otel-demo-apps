name: Release recommendation service to local Kubernetes

on:
  push:
    branches:
      - local
    paths:
      - apps/recommendation/**
      - .github/workflows/recommendation-local-release.yml
  workflow_dispatch:

concurrency:
  group: recommendation-local-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: otel-demo-local-recommendation
  LOCAL_GITOPS_REPOSITORY: lackito/otel-demo-gitops-local
  REGISTRY: ghcr.io
  VALUES_FILE: applications/otel-demo/values.yaml

jobs:
  release:
    name: Build, publish, and update local desired state (${{ github.sha }})
    if: github.ref == 'refs/heads/local'
    runs-on: ubuntu-latest

    steps:
      - name: Check out application source
        uses: actions/checkout@v6

      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          source_revision="$(git rev-parse HEAD)"
          image_repository="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          {
            echo "repository=${image_repository}"
            echo "tag=${source_revision}"
            echo "uri=${image_repository}:${source_revision}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify local GitOps write access
        env:
          GH_TOKEN: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
        shell: bash
        run: |
          if [[ "$(gh api "repos/${LOCAL_GITOPS_REPOSITORY}" --jq '.permissions.push')" != "true" ]]; then
            echo "LOCAL_GITOPS_REPOSITORY_TOKEN cannot write to ${LOCAL_GITOPS_REPOSITORY}." >&2
            echo "Grant the fine-grained token access to this repository with Contents: Read and write." >&2
            exit 1
          fi

      - name: Check out local GitOps configuration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LOCAL_GITOPS_REPOSITORY }}
          ref: main
          token: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
          path: local-gitops
          persist-credentials: false

      - name: Test the local values updater
        run: >-
          python3 -m unittest discover
          -s .github/scripts
          -p 'test_*.py'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish arm64 image
        uses: docker/build-push-action@v7
        with:
          context: apps/recommendation
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=recommendation-local
          cache-to: type=gha,mode=max,scope=recommendation-local

      - name: Verify anonymous image access
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          image_path="${IMAGE_REPOSITORY#ghcr.io/}"
          token="$(
            curl \
              --fail \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --silent \
              --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_path}:pull" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${token}" \
            --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${image_path}/manifests/${IMAGE_TAG}" \
            >/dev/null || {
              echo "The image was published but is not anonymously pullable." >&2
              echo "Make the GHCR package public, then rerun this workflow." >&2
              exit 1
            }

      - name: Update local desired image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          python3 .github/scripts/update_recommendation_values.py \
            --file "local-gitops/${VALUES_FILE}" \
            --repository "${IMAGE_REPOSITORY}" \
            --tag "${IMAGE_TAG}"
          git -C local-gitops diff --check
          git -C local-gitops diff -- "${VALUES_FILE}"

      - name: Commit and push local desired state
        working-directory: local-gitops
        env:
          GITOPS_TOKEN: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if git diff --quiet -- "${VALUES_FILE}"; then
            echo "Local desired state already references ${IMAGE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore(recommendation): deploy ${IMAGE_TAG}"
          git remote set-url origin "https://x-access-token:${GITOPS_TOKEN}@github.com/${LOCAL_GITOPS_REPOSITORY}.git"
          git push origin HEAD:main
