name: CI

on:
  push:
    branches:
      - main
      - local
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run updater tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Parse YAML
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          paths = Dir.glob("**/*.{yaml,yml}", File::FNM_DOTMATCH).reject do |path|
            path.split("/").include?(".git")
          end
          paths.each { |path| YAML.parse_file(path) }
          puts "Parsed #{paths.length} YAML files."
          RUBY

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  custom-services:
    name: Custom services (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/product-catalog/go.mod
          cache-dependency-path: apps/product-catalog/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install ruamel.yaml==0.18.16 grpcio==1.78.0 grpcio-tools==1.78.0
      - name: Test promotion races and catalog reloads
        run: |
          python -m unittest discover -s tests -v
          cd apps/product-catalog
          go test -race ./...
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - name: Check pinned chart compatibility
        run: python scripts/check_chart.py
      - name: Build and smoke test real containers
        run: |
          docker build -f apps/product-catalog/Dockerfile -t catalog:test .
          docker build -f apps/ad/Dockerfile -t ad:test .
          python scripts/smoke.py product-catalog catalog:test
          python scripts/smoke.py ad ad:test
      - name: Build and regression test Recommendation
        run: |
          docker build -t recommendation:test apps/recommendation
          python apps/recommendation/smoke.py recommendation:test
