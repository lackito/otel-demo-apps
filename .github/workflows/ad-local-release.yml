name: Release ad service to local Kubernetes

on:
  push:
    branches: [local]
    paths:
      - apps/ad/**
      - pb/**
      - scripts/smoke.py
      - scripts/promote.py
      - tests/fixtures/**
      - .github/workflows/ad-local-release.yml
  workflow_dispatch:

concurrency:
  group: ad-local-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  LOCAL_GITOPS_REPOSITORY: lackito/otel-demo-gitops-local
  VALUES_FILE: applications/otel-demo/values.yaml

jobs:
  release:
    if: github.ref == 'refs/heads/local'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test and promotion dependencies
        run: |
          python -m pip install --only-binary=:all: grpcio==1.78.0 grpcio-tools==1.78.0 ruamel.yaml==0.18.16
      - name: Test promotion behavior
        run: python -m unittest discover -s tests -v
      - name: Resolve image reference
        id: image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/otel-demo-local-ad"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "uri=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify local GitOps write access
        env:
          GH_TOKEN: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
        run: |
          test "$(gh api "repos/$LOCAL_GITOPS_REPOSITORY" --jq '.permissions.push')" = true
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and test native ARM64 image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          docker build --platform linux/arm64 -f apps/ad/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" .
          python scripts/smoke.py ad "$IMAGE_URI"
      - name: Publish image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: docker push "$IMAGE_URI"
      - name: Pull anonymously and verify published image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          # Empty Docker credentials ensure kind can pull without imagePullSecrets.
          docker --config "$anonymous_config" pull "$IMAGE_URI" || {
            echo "Make the GHCR package public, then rerun this local-branch workflow." >&2
            exit 1
          }
          python scripts/smoke.py ad "$IMAGE_URI"
          docker image inspect "$IMAGE_URI" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out local GitOps
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LOCAL_GITOPS_REPOSITORY }}
          ref: main
          token: ${{ secrets.LOCAL_GITOPS_REPOSITORY_TOKEN }}
          path: local-gitops
      - name: Promote verified image with concurrent-update retries
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          python scripts/promote.py --checkout local-gitops --file "$VALUES_FILE" \
            --component ad --target local \
            --repository "$IMAGE_REPOSITORY" --tag "$GITHUB_SHA"
