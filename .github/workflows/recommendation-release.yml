name: Release recommendation service

on:
  push:
    branches:
      - main
    paths:
      - apps/recommendation/**
      - .github/workflows/recommendation-release.yml
  workflow_dispatch:

concurrency:
  group: recommendation-release-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::650032249451:role/otel-demo-dev-recommendation-github-actions
  AWS_OIDC_SUBJECT: repo:lackito@6595109/otel-demo-apps@1305341394:ref:refs/heads/main
  ECR_REPOSITORY: recommendation
  GITOPS_REPOSITORY: lackito/otel-demo-gitops
  GITOPS_VALUES_FILE: applications/otel-demo/values.yaml

jobs:
  release:
    name: Build, publish, and promote
    runs-on: ubuntu-latest

    steps:
      - name: Check out application source
        uses: actions/checkout@v6

      - name: Verify GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const expectedSubject = process.env.AWS_OIDC_SUBJECT;
            const validAudience = Array.isArray(claims.aud)
              ? claims.aud.includes('sts.amazonaws.com')
              : claims.aud === 'sts.amazonaws.com';

            core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);
            core.info(`OIDC subject: ${claims.sub}`);
            core.info(`Expected subject: ${expectedSubject}`);

            if (!validAudience || claims.sub !== expectedSubject) {
              core.setFailed('GitHub OIDC claims do not match the AWS IAM trust policy.');
            }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: recommendation-release-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          image_tag="${GITHUB_SHA}"
          image_uri="${REGISTRY}/${ECR_REPOSITORY}:${image_tag}"
          docker build --tag "${image_uri}" apps/recommendation
          docker push "${image_uri}"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Check out GitOps configuration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_REPOSITORY_TOKEN }}
          path: gitops
          persist-credentials: false

      - name: Update desired image version
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          sed -i "s|^      tag: .*|      tag: ${IMAGE_TAG}|" "${GITOPS_VALUES_FILE}"
          git diff --check
          git diff -- "${GITOPS_VALUES_FILE}"

      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPOSITORY_TOKEN }}
        run: |
          if git diff --quiet -- "${GITOPS_VALUES_FILE}"; then
            echo "GitOps repository already references ${IMAGE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GITOPS_VALUES_FILE}"
          git commit -m "chore(recommendation): deploy ${IMAGE_TAG}"
          git remote set-url origin "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git"
          git push origin HEAD:main
